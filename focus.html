<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Still · Focus circle</title>
<link rel="stylesheet" href="css/still.css">
<style>
  html, body { height: 100%; }
  body { background: #000000; color: #FFFFFF; overflow: hidden; display: flex; flex-direction: column; }
  :focus-visible { box-shadow: 0 0 0 2px #000000, 0 0 0 4px #9B4DF5 !important; }
  .top { display: flex; align-items: center; justify-content: space-between; padding: 20px 28px; flex: none; }
  .eyebrow { font-size: 12px; letter-spacing: .3em; text-transform: uppercase; color: #AFA6BC; }
  .exit {
    min-height: 40px; padding: 0 20px; border-radius: 999px; border: 1px solid rgba(255, 255, 255, .28);
    background: transparent; color: #FFFFFF; font-weight: 500; font-size: 14px;
  }
  .exit:hover { background: rgba(255, 255, 255, .1); }
  .tops { display: flex; gap: 8px; }
  .mute { display: inline-flex; align-items: center; gap: 8px; padding: 0 16px 0 14px; }
  .mute svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .mute .spk { fill: currentColor; stroke: none; }
  .mute .off, .mute[aria-pressed="true"] .on { display: none; }
  .mute[aria-pressed="true"] .off { display: inline; }
  .mute[aria-pressed="true"] { color: #AFA6BC; }
  .mute[hidden] { display: none; }
  .stale { align-self: center; margin: 0 24px; padding: 10px 18px; border-radius: 14px; background: #2A1458; color: #FFFFFF; font-size: 14px; text-align: center; }
  .stale[hidden] { display: none; }
  .wrap { flex: 1; min-height: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px; padding: 0 24px; text-align: center; }
  .wrap { gap: 12px; overflow: hidden; padding: 4px 24px 28px; justify-content: center; }
  /* Grows into free height, but no taller than the largest circle so big screens center the group. */
  .stage { margin: 0; }
  /* Hierarchy: task, then time left, then the circle; everything else stays quiet. */
  .head { display: flex; flex-direction: column; align-items: center; gap: 6px; max-width: min(640px, 100%); }
  /* The task stays for screen readers only, so the circle gets the room. */
  .task {
    position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap;
    font-family: 'Inter', -apple-system, 'Segoe UI', sans-serif; font-size: clamp(19px, 1.1rem + 0.6vw, 27px); font-weight: 500;
    margin: 0; line-height: 1.3; letter-spacing: -0.015em; color: #F5F0FA; text-align: center; overflow-wrap: anywhere;
    display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; line-clamp: 2; overflow: hidden;
  }
  .clock {
    font-family: 'Inter', -apple-system, 'Segoe UI', sans-serif; font-size: clamp(24px, 1.2rem + 0.8vw, 34px); font-weight: 400;
    line-height: 1; letter-spacing: -0.02em; color: #E9DDF8; text-align: center;
    font-variant-numeric: tabular-nums; font-feature-settings: 'tnum' 1;
  }
  /* The circle takes all the height the task, timer, text and controls leave free, up to
     480px, measured by a size container so it can never push the controls off screen.
     The 4% inset leaves room for the breathing scale (up to 1.03) without clipping. */
  .stage { flex: 1 1 0; min-height: 0; align-self: stretch; container-type: size; display: grid; place-items: center; }
  .circle {
    --size: min(100cqh, 96cqw);
    width: var(--size); height: var(--size); border: 0; padding: 0; border-radius: 50%; flex: none;
    background: transparent; animation: breathe 9s ease-in-out infinite; transition: opacity .6s;
  }
  .circle img { width: 100%; height: 100%; border-radius: 50%; display: block; animation: spin 80s linear infinite; }
  body.dim .circle { opacity: .5; }
  body.dim .task, body.dim .hint { opacity: .6; }
  .hint { font-size: 15px; font-weight: 400; line-height: 1.5; color: #AFA6BC; }
  .meta { font-size: 14px; font-weight: 400; line-height: 1.5; color: #AFA6BC; opacity: .8; }
  .quiet { text-align: center; max-width: 720px; }
  .meta:not(:empty) + .meta::before { content: " · "; }

  @media (min-width: 1280px) {
    .top { position: absolute; top: 0; left: 0; right: 0; z-index: 4; pointer-events: none; }
    .top > * { pointer-events: auto; }
    .wrap { padding-top: 28px; }
  }
  /* Short windows and small popups: tighten spacing and drop the streak line first. */
  @media (max-height: 760px) {
    .wrap { gap: 14px; }
    #streak { display: none; }
  }
  @media (max-height: 680px) {
    .head { gap: 2px; }
    .quiet { display: none; }
  }
  @media (max-height: 600px) {
    .top { padding: 12px 20px; }
    .clock { font-size: 24px; }
    .meta { display: none; }
  }
  @media (max-width: 560px) {
    .top { padding: 14px 16px; }
    .eyebrow { display: none; }
    .wrap { padding: 0 16px; }
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes breathe { 0%, 100% { transform: scale(0.97); } 50% { transform: scale(1.03); } }
  @media (prefers-reduced-motion: reduce) { .circle, .circle img { animation: none; } }
</style>
</head>
<body>
<header class="top">
  <span class="eyebrow">Still · focusing</span>
  <div class="tops">
    <button class="exit mute" id="mute" type="button" aria-pressed="false" title="Mute music"><svg viewBox="0 0 24 24" aria-hidden="true"><path class="spk" d="M4 9h4l5-4v14l-5-4H4z"/><path class="on" d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/><path class="off" d="M17 9l5 6M22 9l-5 6"/></svg><span id="mute-l">Sound on</span></button>
    <button class="exit" id="end" type="button">End focus</button>
  </div>
</header>
<div class="stale" id="stale" role="alert" hidden>Still was updated. Open <b>chrome://extensions</b>, click the round reload arrow on Still, then start focus again.</div>
<div class="wrap">
  <div class="head">
    <h1 class="task" id="task"></h1>
    <div class="clock" id="clock" role="timer" aria-label="Time left"></div>
  </div>
  <div class="stage">
    <div class="circle" id="circle" role="img" aria-label="Focus circle">
      <img id="img" alt="">
    </div>
  </div>
  <div class="hint">Your timer is running. Breathe with the circle.</div>
  <div class="quiet">
    <span class="meta" id="meta"></span><span class="meta" id="streak"></span>
  </div>
</div>
<script type="module" src="js/focus.js"></script>
</body>
</html>
