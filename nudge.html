<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Still · Coming up</title>
<link rel="stylesheet" href="css/still.css">
<style>
  /* Same scroll shape as the capture window: two rollers with a sheet between them. */
  html, body { height: 100%; overflow: hidden; }
  body { display: flex; flex-direction: column; padding: 10px 12px; background: #F3EFF9; }
  .roller {
    position: relative; z-index: 2; flex: none; height: 44px; display: flex; align-items: center; gap: 6px;
    padding: 0 8px 0 14px; border-radius: 22px; background: var(--grad); color: #FFFFFF;
    box-shadow: 0 6px 16px rgba(107, 47, 214, 0.28), inset 0 1px 0 rgba(255, 255, 255, 0.35), inset 0 -2px 0 rgba(0, 0, 0, 0.12);
  }
  .roller::before, .roller::after {
    content: ""; position: absolute; top: 50%; width: 7px; height: 24px; margin-top: -12px;
    border-radius: 4px; background: #5B21B6; box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.25);
  }
  .roller::before { left: -6px; }
  .roller::after { right: -6px; background: #A12FA8; }
  header img { width: 18px; height: 18px; filter: brightness(0) invert(1); }
  header h1 { flex: 1; font-size: 14px; font-weight: 600; letter-spacing: -0.01em; white-space: nowrap; }
  .hbtn {
    height: 30px; min-width: 30px; padding: 0 7px; border: 0; border-radius: 999px;
    background: transparent; color: #FFFFFF; display: inline-flex; align-items: center; justify-content: center;
  }
  .hbtn:hover { background: rgba(255, 255, 255, 0.2); }
  .hbtn:focus-visible { box-shadow: 0 0 0 2px #FFFFFF !important; }
  svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .sheet {
    flex: 1; min-height: 0; display: flex; flex-direction: column; justify-content: center; gap: 6px;
    margin: -16px 6px; padding: 26px 26px; text-align: center;
    background: linear-gradient(180deg, #FFFFFF 0%, #FFFDFB 100%);
    box-shadow: 0 10px 30px rgba(60, 30, 110, 0.10);
    -webkit-mask: radial-gradient(ellipse 12px 54% at 0 50%, transparent 97%, #000 100%) left / 51% 100% no-repeat,
                  radial-gradient(ellipse 12px 54% at 100% 50%, transparent 97%, #000 100%) right / 51% 100% no-repeat;
            mask: radial-gradient(ellipse 12px 54% at 0 50%, transparent 97%, #000 100%) left / 51% 100% no-repeat,
                  radial-gradient(ellipse 12px 54% at 100% 50%, transparent 97%, #000 100%) right / 51% 100% no-repeat;
  }
  .when { font-size: 12px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: var(--v4); }
  .title { font-family: 'Inter Tight', sans-serif; font-size: 22px; font-weight: 600; letter-spacing: -0.03em; line-height: 1.2; color: var(--ink); overflow-wrap: anywhere; }
  .meta { font-size: 13px; color: var(--g5); }
  .acts { flex: 1; display: flex; align-items: center; gap: 6px; margin-left: -6px; }
  .acts .grow { flex: 1; }
  .ghost { height: 30px; padding: 0 12px; border: 0; border-radius: 999px; background: transparent; color: #FFFFFF; font-size: 12.5px; font-weight: 600; }
  .ghost:hover { background: rgba(255, 255, 255, 0.2); }
  [hidden] { display: none !important; }
  /* Picker: how long, which circle, which music. */
  body.picking .sheet { justify-content: flex-start; gap: 12px; padding: 30px 22px 28px; text-align: left; }
  .pick { display: flex; flex-direction: column; gap: 14px; }
  .pick-title { font-family: 'Inter Tight', sans-serif; font-size: 16px; font-weight: 600; letter-spacing: -0.02em; color: var(--ink); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .grp { display: flex; flex-direction: column; gap: 7px; }
  .lbl { font-size: 11px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--g5); }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { height: 30px; padding: 0 12px; border-radius: 999px; border: 1px solid var(--g2); background: #FFFFFF; color: var(--ink); font-size: 12.5px; font-weight: 500; }
  .chip:hover { border-color: var(--v2); }
  .chip[aria-checked="true"] { border-color: var(--v3); background: var(--v3); color: #FFFFFF; }
  .step { display: inline-flex; align-items: center; gap: 4px; margin-top: 2px; }
  .step button { width: 30px; height: 30px; border-radius: 999px; border: 1px solid var(--g2); background: #FFFFFF; color: var(--ink); font-size: 16px; line-height: 1; }
  .step output { min-width: 64px; text-align: center; font-size: 13.5px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .circles { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px 6px; }
  .circ { display: flex; flex-direction: column; align-items: center; gap: 5px; padding: 6px 4px; border: 1px solid transparent; border-radius: 14px; background: transparent; font-size: 12px; font-weight: 500; color: var(--ink); }
  .circ img { width: 44px; height: 44px; border-radius: 50%; background: #000; display: block; box-shadow: 0 0 0 2px #FFFFFF, 0 0 0 3px var(--g2); }
  .circ[aria-checked="true"] { border-color: var(--g2); background: #F7F3FD; }
  .circ[aria-checked="true"] img { box-shadow: 0 0 0 2px #FFFFFF, 0 0 0 4px var(--v3); }
  .go { min-height: 30px; padding: 0 16px; font-size: 13px; background: #FFFFFF !important; color: var(--v3) !important; box-shadow: 0 2px 8px rgba(0, 0, 0, 0.12) !important; }
</style>
</head>
<body>
<header class="roller">
  <img src="assets/ring.png" alt="">
  <h1 id="head">Coming up</h1>
  <button class="hbtn" id="close" title="Not now" aria-label="Not now"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
</header>
<main class="sheet">
  <div id="info" role="status" style="display:contents">
    <span class="when" id="when"></span>
    <span class="title" id="title"></span>
    <span class="meta" id="meta"></span>
  </div>
  <div class="pick" id="pick" hidden>
    <span class="pick-title" id="pick-title"></span>
    <div class="grp">
      <span class="lbl" id="len-l">How long</span>
      <div class="chips" role="radiogroup" aria-labelledby="len-l" id="lens">
        <button type="button" class="chip" role="radio" data-len="10">10 min</button>
        <button type="button" class="chip" role="radio" data-len="15">15 min</button>
        <button type="button" class="chip" role="radio" data-len="custom">Custom</button>
      </div>
      <div class="step" id="step" hidden>
        <button type="button" id="less" aria-label="5 minutes less">−</button>
        <output id="custom" aria-live="polite"></output>
        <button type="button" id="more" aria-label="5 minutes more">+</button>
      </div>
    </div>
    <div class="grp">
      <span class="lbl" id="circ-l">Focus circle</span>
      <div class="circles" role="radiogroup" aria-labelledby="circ-l" id="circles"></div>
    </div>
    <div class="grp">
      <span class="lbl" id="snd-l">Music</span>
      <div class="chips" role="radiogroup" aria-labelledby="snd-l" id="sounds"></div>
    </div>
  </div>
</main>
<footer class="roller">
  <div class="acts">
    <button class="ghost" id="setup" title="Open the Focus page with this task filled in">Set up first</button>
    <button class="ghost" id="back" hidden>Back</button>
    <span class="grow"></span>
    <button class="btn btn-primary go" id="focus">Focus now</button>
  </div>
</footer>
<script type="module" src="js/nudge.js"></script>
</body>
</html>
