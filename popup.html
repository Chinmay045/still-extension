<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Still</title>
<link rel="stylesheet" href="css/still.css">
<link rel="stylesheet" href="css/session.css">
<style>
  body { width: 340px; padding: 18px; }
  .top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
  .top img { height: 26px; }
  .cal { display: inline-flex; align-items: center; gap: 7px; height: 30px; padding: 0 12px; border-radius: 999px; border: 1px solid var(--g2); background: #FFFFFF; color: var(--ink); font-size: 12.5px; font-weight: 600; }
  .cal:hover { background: var(--lav); }
  .cal .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--g3); flex: none; }
  .cal[data-state="synced"] .dot { background: #34C759; }
  .cal[data-state="off"] { color: var(--v3); border-color: var(--lav-border); background: var(--lav); }
  .cal[data-state="broken"] { color: #B42318; border-color: #F4C7C3; background: #FEF3F2; }
  .cal[data-state="broken"] .dot { background: #E5484D; }
  .cal-note { font-size: 12px; color: #B42318; text-align: right; margin: -10px 0 10px; }
  .stack { display: flex; flex-direction: column; gap: 12px; }
  .links { display: flex; justify-content: space-between; margin-top: 4px; }
  .links button { border: 0; background: transparent; color: var(--v2); font-weight: 500; font-size: 13.5px; padding: 6px 4px; border-radius: 8px; }
  .links button:hover { background: var(--lav); }
  .meta { font-size: 12.5px; color: var(--g3); text-align: center; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<div class="top">
  <img src="assets/logo.png" alt="Still">
  <button class="cal" id="cal" type="button" data-state="off"><span class="dot" aria-hidden="true"></span><span id="cal-label">Connect Calendar</span></button>
</div>

<div class="cal-note" id="cal-note" role="status" hidden></div>

<section id="idle" class="stack" hidden>
  <button class="btn btn-primary" id="start">Start focus</button>
  <div class="meta" id="idle-meta"></div>
  <div class="links">
    <button id="to-bucket" title="Review the thoughts you saved">Bucket <span id="bucket-count"></span></button>
    <button id="to-capture" title="Write a thought down without leaving your work (Alt+P)">Capture thought</button>
    <button id="to-block" title="Choose the sites Still blocks">Block</button>
  </div>
</section>

<section id="active" hidden>
  <div class="sess light" id="sess"></div>
</section>

<script type="module" src="js/popup.js"></script>
</body>
</html>
